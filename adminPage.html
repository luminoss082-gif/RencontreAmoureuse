<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/core/config.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

nav {
  padding:15px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

nav a {
  color:white;
  margin-right:15px;
  text-decoration:none;
  opacity:0.8;
}
nav a:hover { opacity:1; }

.container { padding:20px; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card {
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:20px;
  backdrop-filter:blur(10px);
}

button {
  padding:8px;
  margin:3px;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Accueil</a>
  <a href="profile.html">👤 Profil</a>
  <a href="pageDesProfils.html">🔍 Recherche</a>
<a href="admin-support.html">
  💬 Support <span id="supportBadge">🔴</span>
</a>
<a href="adminPage.html">👤 Admin</a>
</nav>

<div class="container">

<h1>⚡ Admin Dashboard</h1>

<div id="status">Chargement...</div>

<div class="grid">

  <div class="card">
    <h2>👤 Users</h2>
    <canvas id="usersChart"></canvas>
  </div>

  <div class="card">
    <h2>💎 Premium</h2>
    <canvas id="premiumChart"></canvas>
  </div>

  <div class="card">
    <h2>💬 Messages</h2>
    <canvas id="messagesChart"></canvas>
  </div>

  <div class="card">
    <h2>🔑 Codes Premium</h2>
    <button onclick="generateCode()">➕ Générer 30 jours</button>
    <div id="codesList"></div>
  </div>

  <div class="card">
    <h2>👥 Users</h2>
    <div id="usersList"></div>
  </div>

  <div class="card">
    <h2>📜 Logs</h2>
    <div id="logsList"></div>
  </div>

  <div class="card">
    <h2>👨‍💻 Admins</h2>
    <div id="adminsList"></div>
  </div>

  <div class="card">
  <h2>💬 Support</h2>
  <p>Gérer les tickets utilisateurs en temps réel</p>
  <a href="admin-support.html">
    <button>Ouvrir le support</button>
  </a>
</div>
</div>

</div>

<script>

let state = { user:null };
async function checkSupportNotif() {

  const { count } = await supabaseClient
    .from("support_messages")
    .select("*", { count:"exact", head:true })
    .eq("read", false);

  document.getElementById("supportBadge").style.display =
    count > 0 ? "inline" : "none";
}

checkSupportNotif();
/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", async () => {

  const { data } = await supabaseClient.auth.getUser();
  if (!data?.user) return location.href="login.html";

  state.user = data.user;

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("user_id", state.user.id)
    .single();

  if (!profile || profile.role !== "admin") {
    alert("⛔ Accès refusé");
    return location.href="index.html";
  }

  document.getElementById("status").textContent = "✔ Admin connecté";

  loadDashboard();
  loadUsers();
  loadCodes();
  loadLogs();
  loadAdmins();
});

/* ================= DASHBOARD ================= */
async function loadDashboard() {

  const { count: users } = await supabaseClient
    .from("profiles")
    .select("*", { count:"exact", head:true });

  const { count: premium } = await supabaseClient
    .from("profiles")
    .select("*", { count:"exact", head:true })
    .eq("is_premium", true);

  const { count: messages } = await supabaseClient
    .from("messages")
    .select("*", { count:"exact", head:true });

  new Chart(document.getElementById("usersChart"), {
    type:"bar",
    data:{ labels:["Users"], datasets:[{ data:[users] }] }
  });

  new Chart(document.getElementById("premiumChart"), {
    type:"doughnut",
    data:{ labels:["Premium","Free"], datasets:[{ data:[premium, users-premium] }] }
  });

  new Chart(document.getElementById("messagesChart"), {
    type:"line",
    data:{ labels:["Messages"], datasets:[{ data:[messages] }] }
  });
}

/* ================= PREMIUM CODES ================= */
async function generateCode() {

  const code = "PREM-" + Math.random().toString(36).substring(2,10).toUpperCase();

  const expires = new Date();
  expires.setDate(expires.getDate() + 30);

  const { error } = await supabaseClient
    .from("premium_codes")
    .insert({
      code,
      used:false,
      expires_at:expires.toISOString()
    });

  if (error) return alert(error.message);

  loadCodes();
  alert("Code créé : " + code);
}

async function loadCodes() {

  const { data } = await supabaseClient
    .from("premium_codes")
    .select("*")
    .order("created_at",{ascending:false});

  const box = document.getElementById("codesList");
  box.innerHTML="";

  (data||[]).forEach(c=>{

    const expired = c.expires_at && new Date(c.expires_at) < new Date();

    const div = document.createElement("div");
    div.innerHTML = `
      <b>${c.code}</b><br>
      ${c.used ? "❌ utilisé" : expired ? "⛔ expiré" : "✅ actif"}<br>
      <button onclick="copy('${c.code}')">📋</button>
      <button onclick="deleteCode('${c.id}')">🗑</button>
      <hr>
    `;

    box.appendChild(div);
  });
}

function copy(code){
  navigator.clipboard.writeText(code);
}

async function deleteCode(id){
  await supabaseClient.from("premium_codes").delete().eq("id",id);
  loadCodes();
}

/* ================= USERS ================= */
async function loadUsers() {

  const { data } = await supabaseClient
    .from("profiles")
    .select("*");

  const box = document.getElementById("usersList");
  box.innerHTML="";

  (data||[]).forEach(u=>{

    const div = document.createElement("div");
    div.innerHTML = `
      <b>${u.prenom||"User"}</b><br>
      ${u.is_premium?"💎":"🆓"} ${u.banned?"🚫":"✔"}<br>

      <button onclick="togglePremium('${u.user_id}',${u.is_premium})">Premium</button>
      <button onclick="toggleBan('${u.user_id}',${u.banned})">Ban</button>
    `;

    box.appendChild(div);
  });
}

async function togglePremium(id,status){
  await supabaseClient.from("profiles").update({is_premium:!status}).eq("user_id",id);
  loadUsers();
}

async function toggleBan(id,status){
  await supabaseClient.from("profiles").update({banned:!status}).eq("user_id",id);
  loadUsers();
}

/* ================= ADMINS ================= */
async function loadAdmins(){

  const { data } = await supabaseClient.from("admins").select("*");

  const box = document.getElementById("adminsList");
  box.innerHTML="";

  (data||[]).forEach(a=>{
    const div = document.createElement("div");
    div.innerHTML = `
      <b>${a.name}</b> - ${a.phone}
      <button onclick="deleteAdmin('${a.id}')">🗑</button>
    `;
    box.appendChild(div);
  });
}

async function deleteAdmin(id){
  await supabaseClient.from("admins").delete().eq("id",id);
  loadAdmins();
}

/* ================= LOGS ================= */
async function loadLogs(){

  const { data } = await supabaseClient
    .from("admin_logs")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(20);

  const box=document.getElementById("logsList");
  box.innerHTML="";

  (data||[]).forEach(l=>{
    box.innerHTML += `<div>${l.action} → ${l.target_id}</div>`;
  });
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Support Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/config.js"></script>

<style>
body {margin:0;font-family:Arial;background:#0f172a;color:white}
.container {display:flex;height:100vh}

/* LEFT */
.left {
  width:30%;
  background:#111827;
  overflow:auto;
}

.ticket {
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.ticket:hover {background:#1f2937}

/* RIGHT */
.right {
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat {
  flex:1;
  overflow:auto;
  padding:10px;
  background:#111;
}

.msg {
  margin:5px;
  padding:8px;
  border-radius:8px;
  max-width:60%;
}
.me {background:#ff4d6d;margin-left:auto}
.them {background:#333}

input,button {padding:10px}
</style>
</head>

<body>
<nav>
  <a href="index.html">🏠 Accueil</a>
  <a href="profile.html">👤 Profil</a>
  <a href="pageDesProfils.html">🔍 Recherche</a>
</nav>

<div class="container">

<!-- LEFT TICKETS -->
<div class="left" id="tickets"></div>

<!-- RIGHT CHAT -->
<div class="right">

  <div class="chat" id="chat"></div>

  <div style="display:flex">
    <input id="msg" style="flex:1" placeholder="Répondre...">
    <button onclick="send()">Envoyer</button>
  </div>

</div>

</div>

<script>

let currentTicket = null;
let admin = null;

/* INIT */
document.addEventListener("DOMContentLoaded", async () => {

  const { data } = await supabaseClient.auth.getUser();
  if (!data?.user) return location.href="login.html";

  admin = data.user;

  loadTickets();
  listenTickets();
});

/* LOAD TICKETS */
async function loadTickets() {

  const { data } = await supabaseClient
    .from("support_tickets")
    .select("*")
    .order("created_at",{ascending:false});

  const box = document.getElementById("tickets");
  box.innerHTML="";

  (data||[]).forEach(t=>{

    const div = document.createElement("div");
    div.className="ticket";

    div.innerHTML = `
      🎫 Ticket<br>
      ${t.status} <br>
      ${t.assigned_admin || "non assigné"}
    `;

    div.onclick = () => openTicket(t);

    box.appendChild(div);
  });
}

/* OPEN */
async function openTicket(t) {

  currentTicket = t;

  document.getElementById("chat").innerHTML="";

  const { data } = await supabaseClient
    .from("support_messages")
    .select("*")
    .eq("ticket_id", t.id)
    .order("created_at");

  data.forEach(render);
}

/* RENDER */
function render(m){

  const div = document.createElement("div");
  div.className="msg " + (m.sender_id === admin.id ? "me":"them");
  div.textContent = m.message;

  document.getElementById("chat").appendChild(div);
}

/* SEND */
async function sendMsg() {

  if (!user?.id) return alert("Non connecté");
  if (!ticketId) return alert("Ticket pas prêt");

  const msg = document.getElementById("msg").value.trim();
  if (!msg) return;

  const { error } = await supabaseClient
    .from("support_messages")
    .insert({
      ticket_id: ticketId,
      sender_id: user.id,
      message: msg,
      created_at: new Date().toISOString()
    });

  if (error) {
    console.error(error);
    alert("Erreur envoi: " + error.message);
    return;
  }

  document.getElementById("msg").value = "";
  loadMessages();
}

/* REALTIME */
function listenTickets(){

  supabaseClient
    .channel("support_admin")
    .on("postgres_changes",
      {event:"INSERT",schema:"public",table:"support_messages"},
      payload => {

        if(currentTicket && payload.new.ticket_id === currentTicket.id){
          render(payload.new);
        }

        loadTickets();
      }
    )
    .subscribe();
}

supabaseClient
  .channel("notif")
  .on("postgres_changes",
    {event:"INSERT",schema:"public",table:"support_messages"},
    () => {
      alert("🔴 Nouveau message support !");
    }
  )
  .subscribe();
</script>

</body>
</html>

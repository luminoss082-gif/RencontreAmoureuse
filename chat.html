<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chat App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/config.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background: linear-gradient(-45deg, #ff4d6d, #7b2ff7, #00c6ff);
  background-size: 400% 400%;
  animation: bg 12s ease infinite;
  color:white;
}

@keyframes bg {
  0% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

nav {
  display:flex;
  justify-content:center;
  gap:15px;
  padding:15px;
  background:rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
}

nav a, nav button {
  color:white;
  text-decoration:none;
  background:none;
  border:none;
  cursor:pointer;
  opacity:0.8;
}
nav a:hover, nav button:hover { opacity:1; }

.layout {
  display:flex;
  height:calc(100vh - 60px);
}

.users {
  width:320px;
  overflow-y:auto;
  background:rgba(0,0,0,0.2);
  border-right:1px solid rgba(255,255,255,0.1);
}

.user {
  display:flex;
  gap:10px;
  padding:12px;
  cursor:pointer;
  align-items:center;
}

.user:hover { background:rgba(255,255,255,0.1); }

.user img {
  width:45px;
  height:45px;
  border-radius:50%;
}

.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

.header {
  padding:10px;
  background:rgba(0,0,0,0.25);
  font-weight:bold;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  max-width:60%;
  padding:8px;
  margin:6px;
  border-radius:10px;
}

.me { background:#ff4d6d; margin-left:auto; }
.them { background:#333; }

.input {
  display:flex;
  padding:10px;
  gap:5px;
  background:rgba(0,0,0,0.2);
}

.input input {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
}

.input button {
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Accueil</a>
  <a href="profile.html">👤 Profil</a>
  <button onclick="openSupport()">💬 Support</button>
</nav>

<div class="layout">

  <div class="users" id="users"></div>

  <div class="chat">

    <div class="header" id="chatHeader">💬 Sélectionne un chat</div>

    <div class="messages" id="messages"></div>

    <div class="input">
      <input id="input" placeholder="Message...">
      <button onclick="sendMessage()">➤</button>
    </div>

  </div>
</div>

<script>

const state = {
  user: null,
  current: null
};

let isSupport = false;
let supportTicketId = null;

/* INIT */
document.addEventListener("DOMContentLoaded", async () => {

  const { data } = await supabaseClient.auth.getUser();
  if (!data?.user) return location.href = "login.html";

  state.user = data.user;

  loadUsers();
  listenMessages();
});

/* ================= SUPPORT ================= */

async function openSupport() {

  isSupport = true;
  state.current = null;

  document.getElementById("chatHeader").innerText = "💬 Support";

  await initSupportTicket();
  loadMessages();
}

async function initSupportTicket() {

  const { data: existing } = await supabaseClient
    .from("support_tickets")
    .select("*")
    .eq("user_id", state.user.id)
    .eq("status", "open")
    .maybeSingle();

  if (existing) {
    supportTicketId = existing.id;
    return;
  }

  const { data, error } = await supabaseClient
    .from("support_tickets")
    .insert({
      user_id: state.user.id,
      status: "open"
    })
    .select()
    .single();

  if (error) {
    console.error(error);
    alert("Erreur support (RLS Supabase)");
    return;
  }

  supportTicketId = data.id;
}

/* ================= USERS ================= */

async function loadUsers() {

  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .neq("user_id", state.user.id);

  const box = document.getElementById("users");
  box.innerHTML = "";

  (data || []).forEach(u => {

    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <img src="${u.photo || 'https://picsum.photos/50'}">
      <div>
        <b>${u.prenom}</b><br>
        <small>${u.online ? "🟢 online" : "⚪ offline"}</small>
      </div>
    `;

    div.onclick = () => openChat(u);
    box.appendChild(div);
  });
}

/* ================= CHAT ================= */

function openChat(u) {

  isSupport = false;
  state.current = u;

  document.getElementById("chatHeader").innerText = "💬 " + u.prenom;

  loadMessages();
}

async function loadMessages() {

  let query;

  if (isSupport) {

    query = supabaseClient
      .from("support_messages")
      .select("*")
      .eq("ticket_id", supportTicketId)
      .order("created_at");

  } else {

    if (!state.current) return;

    const conversationId = [state.user.id, state.current.user_id].sort().join("-");

    query = supabaseClient
      .from("messages")
      .select("*")
      .eq("conversation_id", conversationId)
      .order("created_at");
  }

  const { data } = await query;

  const box = document.getElementById("messages");
  box.innerHTML = "";

  (data || []).forEach(render);
}

/* ================= SEND ================= */

async function sendMessage() {

  const msg = document.getElementById("input").value.trim();
  if (!msg) return;

  if (isSupport) {

    await supabaseClient.from("support_messages").insert({
      ticket_id: supportTicketId,
      sender_id: state.user.id,
      message: msg
    });

  } else {

    const conversationId = [state.user.id, state.current.user_id].sort().join("-");

    await supabaseClient.from("messages").insert({
      sender_id: state.user.id,
      receiver_id: state.current.user_id,
      conversation_id: conversationId,
      message: msg
    });
  }

  document.getElementById("input").value = "";
  loadMessages();
}

/* ================= RENDER ================= */

function render(m) {

  const div = document.createElement("div");
  div.className = "msg " + (m.sender_id === state.user.id ? "me" : "them");

  div.textContent = m.message;

  document.getElementById("messages").appendChild(div);
}

/* ================= REALTIME ================= */

function listenMessages() {

  supabaseClient
    .channel("chat")
    .on("postgres_changes",
      { event:"INSERT", schema:"public", table:"messages" },
      payload => {

        if (!state.current || isSupport) return;

        const m = payload.new;

        const conv = [state.user.id, state.current.user_id].sort().join("-");

        if (m.conversation_id === conv) {
          render(m);
        }
      })
    .subscribe();

  supabaseClient
    .channel("support")
    .on("postgres_changes",
      { event:"INSERT", schema:"public", table:"support_messages" },
      payload => {

        if (!isSupport) return;

        if (payload.new.ticket_id === supportTicketId) {
          render(payload.new);
        }
      })
    .subscribe();
}

</script>

</body>
</html>
